name: Refresh Glass README Widgets

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths-ignore:
      - "assets/widgets/**"

concurrency:
  group: saket745-profile-widgets
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  widgets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate live glass widgets
        env:
          PROFILE_USER: Saket745
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_widgets.py

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Saket745
          outputs: |
            assets/widgets/github-snake.svg?color_snake=%2348c5ff&color_dots=%230f1a2b,%2318273f,%23374aa3,%235a49c6,%238c64e8
            assets/widgets/github-snake-dark.svg?palette=github-dark&color_snake=%23b982ff

      - name: Wrap snake in matching glass panel
        run: python3 scripts/wrap_snake.py

      - name: Publish only when rendered data changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/widgets
          if git diff --cached --quiet; then
            echo "No rendered widget changes."
            exit 0
          fi
          git commit -m "chore: refresh profile telemetry widgets"
          git push origin HEAD:main
