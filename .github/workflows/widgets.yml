name: Refresh Glass README Widgets

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  widgets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate live glass widgets
        env:
          PROFILE_USER: Saket745
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_widgets.py

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Saket745
          outputs: |
            assets/widgets/github-snake.svg?color_snake=%2348c5ff&color_dots=%23121c30,%231b2b49,%234a58bf,%237d5ae8,%23b982ff
            assets/widgets/github-snake-dark.svg?palette=github-dark&color_snake=%23b982ff

      - name: Wrap snake in matching glass panel
        run: python3 scripts/wrap_snake.py

      - name: Publish refreshed widget assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/widgets
          if git diff --cached --quiet; then
            echo "No widget changes to publish."
          else
            git commit -m "chore: refresh profile glass widgets"
            git push
          fi
